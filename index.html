<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notatki z lekcji</title>
<meta name="theme-color" content="#f1f2f4">
<meta name="application-name" content="Notatki z lekcji">
<meta name="description" content="Zeszyty, pismo odręczne, narzędzia, podsumowania i notatki na lekcję.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notatki">
<link rel="manifest" href="./manifest.webmanifest?v=5">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8dce3;--panel:#f1f2f4;--p2:#e5e8ed;--ink:#22262e;--on:#fff;--mute:#6b7482;--line:#cbd1da;--acc:#3b4cc0;--sel:#dbe0f5;--danger:#b83a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--panel:#181d25;--p2:#202732;--ink:#e8ecf2;--on:#10151c;--mute:#8e99a9;--line:#2b3441;--acc:#8fa0ff;--sel:#262f4d;--danger:#ff8b8b}}
:root[data-theme="dark"]{--bg:#0f1318;--panel:#181d25;--p2:#202732;--ink:#e8ecf2;--on:#10151c;--mute:#8e99a9;--line:#2b3441;--acc:#8fa0ff;--sel:#262f4d;--danger:#ff8b8b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 "Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer;border:0;background:none;border-radius:10px;min-height:40px;min-width:40px;padding:0 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button:disabled{opacity:.35;cursor:default}
.ib{display:inline-grid;place-items:center;padding:0;color:var(--mute)}
.ib:hover{color:var(--ink)}
.ib.arm{color:var(--danger);font-size:13px;font-weight:700;padding:0 8px;width:auto}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.logo{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px 14px}

.logo .ib{color:var(--ink);background:var(--p2);border-radius:50%;width:42px;height:42px}
#subs{flex:1;overflow:auto;padding:6px 8px 20px 0}
.sub{border-left:5px solid var(--c);margin:8px 0 0;border-radius:0 12px 12px 0;background:var(--p2);padding:2px 4px 6px 0}
.row{display:flex;align-items:center;min-height:40px;border-radius:8px}
.tr{padding-left:16px}.pr{padding-left:52px}
.nm{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.sn{font-weight:700;font-size:17px}.tn{font-weight:600}.pn{color:var(--mute);font-size:15px}
.pr.cur{background:var(--sel)}.pr.cur .pn{color:var(--ink);font-weight:600}
.tr.cur .tn,.sr.cur .sn{color:var(--acc)}
.chev svg{width:18px;height:18px;transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.ren{flex:1;min-width:0;margin:3px 6px;border:2px solid var(--acc);border-radius:8px;background:var(--panel);padding:6px 8px}
.addrow{margin:6px 0 0 14px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;gap:6px;align-items:center;padding:6px 14px;background:var(--panel)}
#menu{display:none}
.tit{flex:1;min-width:0}
#crumb{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pt{font:700 24px/1.2 "Hanken Grotesk",system-ui,sans-serif;border:0;background:none;width:100%;padding:0}
#tpl{background:var(--p2)}
.tb{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px 14px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.t{color:var(--ink)}
.t svg{width:24px;height:24px}
.t[aria-pressed="true"]{background:var(--ink);color:var(--on)}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px}
.cd{position:relative;width:40px;height:40px;display:inline-block;border-radius:50%;cursor:pointer;padding:0}
.cd i{position:absolute;inset:9px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cd[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink) inset}
.cus i{background:conic-gradient(#e33,#ec2,#3c4,#2bd,#44e,#c3c,#e33)}
.cus input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.szb{width:38px;height:38px;display:grid;place-items:center}
.szb i{display:block;border-radius:50%}
#sz{width:150px;accent-color:var(--ink)}
#szv{font-weight:600;font-size:14px;min-width:54px;color:var(--mute)}
[hidden]{display:none!important}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 20px;font-size:20px}
#setb{overflow:auto;padding:0 20px 28px}
#setb h3{font-size:17px;margin:22px 0 6px;font-weight:700}
.srow{padding:10px 0;border-top:1px solid var(--line)}
.stop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.sl{font-weight:600}.sv{color:var(--mute);font-size:14px}
.sh{margin:4px 0 0;color:var(--mute);font-size:13.5px}
.srow input[type=range]{width:100%;margin-top:6px;accent-color:var(--ink)}
.seg{display:flex;gap:4px;margin-top:8px;background:var(--p2);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:38px;font-size:14px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on);font-weight:600}
.sw{width:50px;height:30px;min-width:50px;border-radius:15px;background:var(--line);position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--panel);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--on)}
.btn{display:block;width:100%;margin-top:8px;background:var(--p2);min-height:44px;text-align:left;padding:0 14px}
.btn.warn{color:var(--danger)}
.btn.go{background:var(--ink);color:var(--on);text-align:center;font-weight:700;margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;background:var(--p2);border-radius:12px;min-height:84px;font-size:13px;line-height:1.2;text-align:center}
.tile svg{width:28px;height:28px}
.fi{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:inherit;color:var(--ink)}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:6;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.calc{position:fixed;right:20px;bottom:24px;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.3);z-index:15;padding:8px 10px 12px}
.chead{display:flex;align-items:center;justify-content:space-between;padding-left:6px}
.cout{background:var(--bg);border-radius:10px;padding:6px 12px;text-align:right;margin:4px 0 8px;min-height:64px}
.cout small{display:block;color:var(--mute);min-height:18px}
#ce{font-size:28px;font-weight:700;overflow-x:auto;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ckeys button{background:var(--p2);min-height:46px;min-width:0;font-size:18px;padding:0}
.ckeys button.op{background:var(--ink);color:var(--on)}
body.lefty .app{grid-template-columns:1fr 300px}body.lefty aside{order:2;border-left:1px solid var(--line);border-right:0}
.st{color:var(--mute);font-size:13px;margin-left:auto}
#sc{flex:1;overflow:auto;padding:18px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#wrap{max-width:1000px;margin:0 auto}
canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.12)}
.more{display:block;margin:16px auto 28px;background:var(--p2);padding:0 18px}
#shb{border-top:1px solid var(--line);padding-top:4px}
#shb select,.tb select{min-height:36px;background:var(--p2);padding:0 8px;border-radius:10px;max-width:170px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fl label{display:block;font-size:13px;color:var(--mute);margin:0 0 3px}
.chk{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:32px}.chk input{width:20px;height:20px;accent-color:var(--ink)}
.err{color:var(--danger);font-weight:600}
.fi[type=color]{padding:2px;height:40px}.fi[type=range]{padding:0;accent-color:var(--ink)}
.sym{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.sym button{min-width:36px;min-height:36px;background:var(--p2);font-size:17px;padding:0}
.tile .gl{font-size:26px;line-height:28px}
.mini{min-height:30px;min-width:52px;font-size:13px;font-weight:700;background:var(--p2);border-radius:8px;margin-right:4px}
.tmr{right:316px}#td{font-size:40px;font-weight:700;text-align:right}#td.done{color:var(--danger)}
@media (max-width:860px){.tmr{right:20px;bottom:auto;top:130px}}
@media (max-width:860px){
.app,body.lefty .app{grid-template-columns:1fr}
aside{position:absolute;inset:0;z-index:5;display:none}
body.nav aside{display:flex}
#menu{display:inline-grid}
}

/* Dostosowanie wyłącznie do niewielkich ekranów aplikacji mobilnej. */
@media(max-width:700px){
 html,body{width:100%;height:100%;height:100dvh;overscroll-behavior:none}
 .app{height:100%;height:100dvh}
 .head{gap:5px;padding:5px 9px;min-height:58px}
 .head .tit{min-width:0}
 #pt{font-size:19px;line-height:1.2}
 #crumb{font-size:11px}
 #tpl{max-width:103px;min-width:0;font-size:13px;padding:0 4px}
 .tb:not(#shb){flex-wrap:nowrap;min-height:52px;padding:4px 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
 .tb:not(#shb)>.tb-unit{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto}
 .tb:not(#shb)>.tb-unit[hidden]{display:none!important}
 .tb:not(#shb)>.sep{flex:0 0 auto}
 .tb:not(#shb)>.st{white-space:nowrap;flex:0 0 auto}
 .tb:not(#shb)>.ib{flex:0 0 auto}
 .tb:not(#shb) #sz{width:100px}
 #shb{max-height:132px;overflow:auto;flex-shrink:0}
 #sc{padding:9px;min-height:0}
 #wrap{width:100%}
 aside{inset:0;width:100%;max-width:100vw;overflow:hidden;box-shadow:4px 0 24px #0002}
 #selbar{bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 12px);overflow-x:auto;white-space:nowrap}
 .calc{right:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 16px));max-height:76dvh;overflow:auto}
 .tmr{top:80px;bottom:auto}
 .sheet{width:100vw;max-width:100vw}
 #setb{padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
 .two,.three{grid-template-columns:repeat(2,minmax(0,1fr))}
 .fi{max-width:100%;font-size:16px}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="logo"><button class="ib" id="addsub" data-i="plus" aria-label="Nowy przedmiot" title="Nowy przedmiot"></button><button class="ib" id="gear" data-i="gear" aria-label="Ustawienia" title="Ustawienia"></button></div>
 <div id="subs"></div>
</aside>
<main>
 <div class="head">
  <button class="ib" id="menu" data-i="menu" aria-label="Przedmioty"></button>
  <div class="tit"><span id="crumb"></span><input id="pt" placeholder="Tytuł strony" aria-label="Tytuł strony"></div>
  <select id="tpl" aria-label="Papier"><option value="line">Linie</option><option value="grid">Kratka</option><option value="dots">Kropki</option><option value="none">Czysta kartka</option></select>
  <button class="ib" id="del" data-i="trash" aria-label="Usuń stronę" title="Usuń stronę"></button>
 </div>
 <div class="tb">
  <button class="ib t" id="bsel" data-i="sel" aria-label="Zaznacz i przesuwaj" title="Zaznacz i przesuwaj" aria-pressed="false"></button>
  <button class="ib t" id="bpen" data-i="pen" aria-label="Pióro" title="Pióro" aria-pressed="true"></button>
  <button class="ib t" id="bhl" data-i="hl" aria-label="Zakreślacz" title="Zakreślacz" aria-pressed="false"></button>
  <button class="ib t" id="ber" data-i="er" aria-label="Gumka" title="Gumka" aria-pressed="false"></button>
   <button class="ib t" id="berfrag" aria-label="Gumka fragmentów kreski" title="Gumka fragmentów kreski" aria-pressed="false"></button>
  <button class="ib t" id="bshp" data-i="shapes" aria-label="Kształty" title="Kształty" aria-pressed="false"></button>
  <span class="sep"></span>
  <span id="cols" style="display:inline-flex"></span><label class="cd cus" id="cus" title="Własny kolor" aria-label="Własny kolor" aria-pressed="false"><input type="color" id="cc" value="#e0457b"><i></i></label>
  <span class="sep"></span>
  <span class="szb"><i id="szp"></i></span><input type="range" id="sz" aria-label="Rozmiar"><span id="szv"></span>
  <span class="sep"></span>
  <button class="ib t" id="undo" data-i="undo" aria-label="Cofnij" title="Cofnij"></button>
  <button class="ib t" id="redo" data-i="redo" aria-label="Ponów" title="Ponów"></button>
  <span class="sep"></span>
  <button class="ib t" id="btools" data-i="tools" aria-label="Narzędzia" title="Narzędzia"></button>
  <button class="ib t" id="bcalc" data-i="calc" aria-label="Kalkulator" title="Kalkulator"></button>
  <button class="ib t" id="bexp" data-i="dl" aria-label="Eksportuj" title="Eksportuj"></button>
  <span class="st" id="st"></span>
 </div>
 <div class="tb" id="shb" hidden></div>
 <div id="sc">
  <div id="wrap"><canvas id="cv"></canvas></div>
  <button class="more" id="more">Dodaj miejsce na dole</button>
 </div>
</main>
</div>
<div id="selbar" hidden><button class="ib t" id="sedit" data-i="edit" aria-label="Edytuj" title="Edytuj"></button><button class="ib t" id="sdup" data-i="copy" aria-label="Duplikuj" title="Duplikuj"></button><button class="ib t" id="sfront" data-i="front" aria-label="Na wierzch" title="Na wierzch"></button><button class="ib t" id="sback" data-i="back" aria-label="Na spód" title="Na spód"></button><button class="ib t" id="sdel" data-i="trash" aria-label="Usuń" title="Usuń"></button></div>
<div class="calc" id="calc" hidden><div class="chead"><b>Kalkulator</b><span><button class="mini" id="cdeg" aria-label="Stopnie lub radiany">DEG</button><button class="ib" id="cclose" data-i="x" aria-label="Zamknij"></button></span></div><div class="cout"><small id="cr"></small><div id="ce">0</div></div><div class="ckeys" id="ck"></div><button class="btn" id="cins">Wstaw wynik do notatki</button></div>
<div class="calc tmr" id="tmr" hidden><div class="chead"><b>Minutnik i stoper</b><button class="ib" id="tclose" data-i="x" aria-label="Zamknij"></button></div><div class="cout"><small id="tmode">Minutnik</small><div id="td">00:00</div></div><div class="ckeys" id="tk"></div></div>
<div id="set" hidden><div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Ustawienia"><div class="shead"><b>Ustawienia</b><button class="ib" id="sclose" data-i="x" aria-label="Zamknij" title="Zamknij"></button></div><div id="setb"></div></div></div>
<script>
(()=>{
const KEY="lekcje-v2",W=1200,$=i=>document.getElementById(i);
const COL=["#3b4cc0","#c2453f","#2f8a55","#d98a12","#8a4fc0","#1a8ca3"];
const PEN=["#1c2533","#2b4fd8","#d03a3a","#1f8a4c","#e08a00","#f2d21b"];
const uid=()=>Math.random().toString(36).slice(2,9);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const SVG=d=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const IC={
 pen:SVG('<path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.6 7.6"/><circle cx="11" cy="11" r="2"/>'),
 hl:SVG('<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>'),
 er:SVG('<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>'),
 undo:SVG('<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
 redo:SVG('<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>'),
 plus:SVG('<path d="M12 5v14M5 12h14"/>'),
 chev:SVG('<path d="m9 6 6 6-6 6"/>'),
 edit:SVG('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 trash:SVG('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
 menu:SVG('<path d="M4 7h16M4 12h16M4 17h16"/>'),
 gear:SVG('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
 x:SVG('<path d="M6 6l12 12M18 6 6 18"/>')
};
document.querySelectorAll("[data-i]").forEach(b=>b.innerHTML=IC[b.dataset.i]);
const cv=$("cv"),sc=$("sc");let cx=cv.getContext("2d");
let S,tool="pen",color=PEN[0],penSeen=false,sel=null,drag=null,hist=[],redo=[],drawing=null,scr=null,erasing=false,changed=false,tm=null,rq=0,ed=null,adding=false;
const DEF={finger:"scroll",palm:true,press:100,smooth:0,hlop:40,theme:"auto",paper:"white",newtpl:"line",gap:56,margin:true,width:1000,pageh:1700,left:false};
let cfg=Object.assign({},DEF);
const PAPER={white:"#fdfdfc",grey:"#e9ecef",yellow:"#fbf5d9"};
const sizes={pen:4,hl:22,er:24,erfrag:12,shp:3},CFG={pen:[.5,24,.5],hl:[6,60,1],er:[8,70,1],erfrag:[3,50,1],shp:[.5,24,.5]};

function eraseAt(e){

  previousEraserPoint=b;
  let any=false;const result=[];
  const safePoint=(x,y,pr)=>[Math.round(x*100)/100,Math.round(y*100)/100,Math.round(pr)];
  for(const stroke of p.strokes){
   const q=stroke.p,n=q.length/3;if(!n){result.push(stroke);continue}

   // fragments remain normal editable pressure-sensitive vector strokes.
   const outside=(x,y)=>d2(x,y,a[0],a[1],b[0],b[1])>r+stroke.w*.1;
   let hasHit=false;
   for(let i=0;i<n&&!hasHit;i++){
    const j=i*3;if(!outside(q[j],q[j+1]))hasHit=true;
    if(i){const x0=q[j-3],y0=q[j-2],x1=q[j],y1=q[j+1],len=Math.hypot(x1-x0,y1-y0),steps=Math.ceil(len/Math.max(2,r/3));

   }

    else if(run.length){pieces.push(run);run=[]}};
   const q0=safePoint(q[0],q[1],q[2]);put(q0,outside(q[0],q[1]));
   for(let i=1;i<n;i++){
    const j=i*3,p0=[q[j-3],q[j-2],q[j-1]],p1=[q[j],q[j+1],q[j+2]],len=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]);

    const at=t=>[p0[0]+(p1[0]-p0[0])*t,p0[1]+(p1[1]-p0[1])*t,p0[2]+(p1[2]-p0[2])*t];

function parseFn(src,deg){
 const s=String(src).toLowerCase().replace(/[\u2212\u2013]/g,"-").replace(/[\u00d7\u00b7]/g,"*").replace(/\u00f7/g,"/").replace(/\u03c0/g,"pi").replace(/\u221a/g,"sqrt").replace(/\u00b2/g,"^2").replace(/\u00b3/g,"^3").replace(/,/g,".").replace(/\s+/g,"");
 const D=deg?Math.PI/180:1,F1={sin:x=>Math.sin(x*D),cos:x=>Math.cos(x*D),tan:x=>Math.tan(x*D),tg:x=>Math.tan(x*D),asin:x=>Math.asin(x)/D,acos:x=>Math.acos(x)/D,atan:x=>Math.atan(x)/D,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round};
 const NM=Object.keys(F1).sort((a,b)=>b.length-a.length);let i=0;
 const bad=()=>{throw new Error("parse")};
 function expr(){let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++],a=v,r=term();v=o==="+"?x=>a(x)+r(x):x=>a(x)-r(x)}return v}
 function term(){let v=unary();for(;;){const c=s[i];if(c==="*"||c==="/"){i++;const a=v,r=unary();v=c==="*"?x=>a(x)*r(x):x=>a(x)/r(x)}else if(c&&/[\d.a-z(]/.test(c)){const a=v,r=unary();v=x=>a(x)*r(x)}else return v}}
 function unary(){if(s[i]==="-"){i++;const r=unary();return x=>-r(x)}if(s[i]==="+"){i++;return unary()}return power()}
 function power(){let b=atom();if(s[i]==="^"){i++;const a=b,e=unary();b=x=>Math.pow(a(x),e(x))}while(s[i]==="%"){i++;const a=b;b=x=>a(x)/100}return b}
 function atom(){
  const c=s[i];
  if(c==="("){i++;const v=expr();if(s[i]!==")")bad();i++;return v}
  const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
  if(m){i+=m[0].length;const v=parseFloat(m[0]);return()=>v}
  for(const w of NM)if(s.startsWith(w,i)&&s[i+w.length]==="("){i+=w.length+1;const v=expr();if(s[i]!==")")bad();i++;const f=F1[w];return x=>f(v(x))}
  if(s.startsWith("pi",i)){i+=2;return()=>Math.PI}
  if(c==="x"){i++;return x=>x}
  if(c==="e"){i++;return()=>Math.E}
  return bad();
 }
 const f=expr();if(i<s.length)bad();return f;
}

 '<rect width="100%" height="100%" fill="#fff4e9"/>'+
 '<text x="20" y="65" font-size="25" fill="#8b4a20" font-family="sans-serif">Nie można odzyskać wycinka</text>'+
 '<text x="20" y="112" font-size="18" fill="#8b4a20" font-family="sans-serif">Sprawdź stronę źródłową i zapisz go ponownie.</text></svg>';
 m.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);

// Prefer small self-contained images in JSON/localStorage, to survive downloading
// a newer HTML file. Large crops stay in IndexedDB, with source-based recovery.
function inlineSummaryImage(canvas){
 const encoded=canvas.toDataURL('image/webp',.80);
 const currentSize=JSON.stringify(S).length;
 return encoded.length<=240000&&currentSize+encoded.length<3600000?encoded:null;
}
async function restoreMissingSummaryClip(o,m){
 if(o._summaryRecovering)return;
 o._summaryRecovering=true;
 try{
  const loc=findSummaryClipOrigin(o.id);
  if(!loc)throw new Error('Brak strony źródłowej lub zaznaczenia');
  const {source,entry,rect}=loc;
  const x=Math.max(0,Math.min(W-1,+rect.x)),y=Math.max(0,Math.min(source.h-1,+rect.y));
  const w=Math.min(W-x,+rect.w),h=Math.min(source.h-y,+rect.h);
  if(w<1||h<1)throw new Error('Nieprawidłowy obszar');
  const scale=Math.min(1.7,1250/w,1250/h);
  // Prevent self-reference if the user marked a fragment of a summary page.
  const renderPage=Object.assign({},source,{importantMarks:[],objs:source.topicSummary?(source.objs||[]).filter(q=>!q.summaryClip):source.objs});
  const src=await rend(renderPage,scale),crop=document.createElement('canvas');
  crop.width=Math.max(1,Math.round(w*scale));crop.height=Math.max(1,Math.round(h*scale));
  crop.getContext('2d',{alpha:false}).drawImage(src,x*scale,y*scale,w*scale,h*scale,0,0,crop.width,crop.height);
  const inline=inlineSummaryImage(crop);
  if(inline){o.src=inline;o.summaryClip=false;m.src=inline;save()}
  else{
   const blob=await new Promise((resolve,reject)=>crop.toBlob(b=>b?resolve(b):reject(new Error('Błąd zapisu')),'image/webp',.85));
   const key=o.src.startsWith('idb:')?o.src.slice(4):'sum-'+uid()+'-'+Date.now();
   await pdfPut(key,blob);o.src='idb:'+key;o.summaryClip=true;
   const url=URL.createObjectURL(blob);PDF_OBJECT_URLS.set(o.id,url);m.src=url;
  }
  if(!entry.crop)entry.crop={x,y,w,h};
  src.width=src.height=0;crop.width=crop.height=0;
  $('st').textContent='Odzyskano zapisany fragment podsumowania';
 }catch(e){
  missingSummaryPreview(m);
  $('st').textContent='Brak wycinka: '+(e.message||'nieznany błąd');
 }finally{delete o._summaryRecovering}
}

 const w=Math.min(W-x,rect.w),h=Math.min(source.h-y,rect.h);if(w<10||h<10)return;

  sum.objs.push(titleObj,imageObj);

  sum.summaryNextY=vy+displayH+122;sum.h=Math.max(sum.h,Math.ceil(sum.summaryNextY+100));

const defaultOrder=toolbarSpec.map(s=>s[0]);

function currentOrder(){const preferred=Array.isArray(cfg.toolbarOrder)?cfg.toolbarOrder:[];

}
function layoutToolbar(){const hidden=new Set(Array.isArray(cfg.toolbarHidden)?cfg.toolbarHidden:[]);

 const renderRows=()=>{
  rowContainer.innerHTML='';const ordered=currentOrder();const off=new Set(cfg.toolbarHidden||[]);

   label.append(check,el('span','',toolbarLabels.get(key)));row.appendChild(label);
   const move=(delta)=>{const arr=currentOrder(),at=arr.indexOf(key),to=at+delta;if(to<0||to>=arr.length)return;
